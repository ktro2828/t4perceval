        { "Entity, component, archetype" = "concepts/entity-component-archetype.md" },
        { "Store" = "concepts/store.md" },
        { "Timeline" = "concepts/timeline.md" },
        { "Coordinate system" = "concepts/coordinate-system.md" },
        { "Evaluation pipeline" = "concepts/evaluation-pipeline.md" },
    ] },
    { "User guide" = [
