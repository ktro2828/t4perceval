[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t4perceval"
version = "0.1.0"
description = "Component-oriented perception evaluation for the T4 dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "attrs>=24.1.0",  # attrs.Converter(takes_self=...)
    "numpy>=1.24.0",
    "pyarrow>=15.0.0",
    "scipy>=1.15.3",
    "shapely>=2.0.0",  # vectorized polygon intersection for BEV / 3D IoU
    "t4-devkit @ git+https://github.com/tier4/t4-devkit@v0.8.0",
    "typing-extensions>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
addopts = ["--disable-plugin-autoload"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.hatch.metadata]
allow-direct-references = true
